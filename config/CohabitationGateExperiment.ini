[Experiment]
; 总开关：1 开启，0 关闭。以下功能开关同样使用 1/0。
Enabled=0

[Conditions]
; 好感度按高等级判断，不改变实际数值。
IgnoreFriendlyLevel=0
; 忽略对方是否可结婚的条件判断。
IgnoreMarriageable=0
; 忽略已有同居对象的限制。
IgnoreLivingTogether=1
; 亲密度按高等级判断，不改变实际数值。
IgnoreAffinityLevel=0
; 忽略种族条件限制。
IgnoreTribe=0

[Relationships]
; 提交婚姻时，忽略自己已有其他已婚对象的限制。
IgnoreExistingMarriageOnCommit=0
; 当前伴侣：0 自动选择；其他数值指定日志中的已婚对象记录键。
PreferredPartnerKey=0
; 召唤或收回当前伴侣时，也对其他已婚对象执行相同动作。
SpawnAllPartners=0
