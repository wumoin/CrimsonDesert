[Experiment]
; 总开关：0 为关闭全部覆盖，1 为按条件和提交层的各子开关执行。
; 插件每 5 秒重新读取本文件；配置缺失时默认关闭。
Enabled=0

[Conditions]
; 1：按虚拟高等级 127 计算 CheckFriendlyLevel；0：保留原版判断。
; 只绕过判断，不增加实际好感数值；亲密度由 IgnoreAffinityLevel 单独控制。
IgnoreFriendlyLevel=0
; 1：忽略 IsMarriageable 可结婚判断；0：保留原版判断。
IgnoreMarriageable=0
; 1：忽略“已有同居对象”限制；0：保留原版判断。
IgnoreLivingTogether=1
; 1：按虚拟高等级 127 计算 CheckAffinityLevel；0：保留原版判断，不改变实际亲密度。
IgnoreAffinityLevel=0
; 等级覆盖保留比较运算：例如“>=3 成功”通过，“<3 拒绝”不通过，避免同时触发。
; 1：忽略 CheckTribe 种族条件（包括人类要求）；0：保留原版判断，不改变角色种族。
IgnoreTribe=0
; 五项均作用于对应条件类型的所有调用，可能影响其他任务或交互。

[Relationships]
; 1：原版提交检查因已有其他已婚对象而失败时，用私有关系视图重新检查。
; 只排除当前角色的现有伴侣；同一目标已婚、目标已婚于其他角色等检查仍交给原版。
; 不强制返回成功，不直接写存档；真正的关系更新仍由游戏执行。
; 需要总开关 Enabled=1，并且日志中 CommitOverrideActive=1 才实际启用。
; 开启后记录本次真正写入路径的目标；只有缓存已出现该目标的已婚记录才切换场景对象。
; 默认关闭；多伴侣保存重载和完整列表 UI 尚未完成实机验证。
IgnoreExistingMarriageOnCommit=0
; 当前对象选择：0 跟随本进程中本次婚姻提交目标；非 0 指定日志中的已婚记录键。
; 仅能选择真实已婚且属于当前可操作角色的记录，不会凭空增加伴侣。
; 自动目标偏好不写存档，重启/读档后可按日志 selectedKey 指定需要的对象。
; 此选择影响使用原版公共伴侣查询的场景、同居/召唤等流程；离婚流程仍需验证。
PreferredPartnerKey=0
; 1：原版召唤/收回当前对象成功后，对其余真实已婚对象执行同样动作；0：原版单对象。
; 受总开关 Enabled 控制，可与婚姻提交覆盖分别启用；需要 SpawnAllActive=1。
; 不会因改配置立即出场，需要重新进入会触发召唤的场景，或执行一次原版召唤/收回。
; 当前对象动作失败时不扩展；其他对象失败只记录原版错误，不修改主动作结果。
; 先在婚礼 CG 结束后的同居/召唤场景测试；剧情复用该入口的行为尚未验证。
; 默认关闭；尚未实机验证全员出场、位置、跟随和存档重载。
SpawnAllPartners=0
