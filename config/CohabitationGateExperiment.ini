[Experiment]
; 总开关：0 为关闭所有覆盖，1 为按下面三个子开关覆盖条件。
; 插件每 5 秒重新读取本文件；配置缺失时默认关闭。
Enabled=0

[Conditions]
; 1：忽略 CheckFriendlyLevel 好感/信任等级条件；0：保留原版判断。
; 只绕过判断，不增加好感数值，也不覆盖独立的 CheckAffinityLevel 亲密度条件。
IgnoreFriendlyLevel=0
; 1：忽略 IsMarriageable 可结婚判断；0：保留原版判断。
IgnoreMarriageable=0
; 1：忽略“已有同居对象”限制；0：保留原版判断。
IgnoreLivingTogether=1
; 三项均作用于对应条件类型的所有调用，可能影响其他任务或交互。
