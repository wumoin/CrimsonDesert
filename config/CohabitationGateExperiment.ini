[Experiment]
; 设为 1 开启补丁，设为 0 关闭补丁；下方开关同样用 1 开启、0 关闭。
Enabled=1

[Conditions]
; 开启后，好感度不足也能满足好感度要求。
IgnoreFriendlyLevel=1
; 开启后，取消对方的结婚资格限制。
IgnoreMarriageable=1
; 开启后，已有同居对象也能继续示爱或求婚。
IgnoreLivingTogether=1
; 开启后，亲密度不足也能满足亲密度要求。
IgnoreAffinityLevel=1
; 开启后，种族不符合要求也能通过。
IgnoreTribe=1

[Relationships]
; 开启后，已经结婚也能与其他对象再次结婚。
IgnoreExistingMarriageOnCommit=1
; 填 0 自动选择当前伴侣；也可在游戏中按 F8 选择已婚对象并设置此项。
PreferredPartnerKey=0
; 点击伴侣美容时先显示插件的已婚对象选择窗口。
BeautyPartnerPicker=1
; 开启后，全员召唤或收回；读档时恢复已设为同行的伴侣。
SpawnAllPartners=1

[UI]
; 弹窗语言：zh-CN 简体中文，en-US English；也可在任一弹窗顶部切换。
Language=zh-CN

[PartnerNames]
; F8 窗口保存的自定义名字，按角色、对象编号和模板区分；重置名字会删除对应项。
; 名字使用编码保存以兼容中文和特殊字符，请通过游戏中的窗口修改。
